name: Verifica Onesta Lean 4 & Aggiornamento Stato Nodi

on:
  push:
    branches: [main]
    paths:
      - 'lean/**'
      - 'content/**'
      - 'scripts/**'
      - '.github/workflows/lean-verify.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-lean:
    name: Compila progetto Lake (Lean 4 + Mathlib) e aggiorna lean.status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Genera manifest Lake (se assente)
        working-directory: lean
        run: |
          if [ ! -f lake-manifest.json ]; then
            if ! command -v lake >/dev/null 2>&1; then
              curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
              export PATH="$HOME/.elan/bin:$PATH"
              echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
            fi
            lake update
          fi

      - name: Compila i file Lean con lean-action (lake build)
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          use-mathlib-cache: true
          build: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Promuovi a 'compiled' solo i blocchi i cui .olean sono stati compilati da lake build
        run: |
          node scripts/sync-lean-status.mjs --after-lake-build
          node scripts/build-content.mjs
          node scripts/validate.mjs

      - name: Salva e committa automaticamente i JSON aggiornati dalla verifica Lean
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lean/lake-manifest.json content/ public/data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(lean): aggiorna lean.status=compiled dopo lake build riuscito [skip ci]"
            git push
          fi
